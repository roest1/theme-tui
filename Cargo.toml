[package]
name = "font"
description = "Pick the font for each of wezterm's lanes."
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/roest1/theme-tui"

[[bin]]
name = "font"
path = "src/main.rs"

[dependencies]
# The same spec as every other tui-core user, so they resolve to one copy.
tui-core = { git = "https://github.com/roest1/tui-core", branch = "main" }
ttf-parser = "0.25"
fontdue = "0.9"
png = "0.18"
libc = "0.2"
serde_json = "1"

[lib]
name = "font"
path = "src/lib.rs"
